[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prism"
version = "0.2.0"
description = "PRISM: physics-structured APOGEE spectral emulator and inverse inference in JAX + Flax NNX"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
# Floors only: on Kaggle the preinstalled JAX/Flax/Orbax must never be replaced.
dependencies = [
    "jax>=0.11",
    "flax>=0.12",
    "optax>=0.2",
    "orbax-checkpoint>=0.12",
    "blackjax>=1.7",
    "h5py",
    "numpy",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "optuna",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["prism*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"  # run the slow end-to-end tests with: pytest -m slow
markers = ["slow: end-to-end stage tests (minutes)"]
